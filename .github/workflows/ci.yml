# The light version of ./test-pipeline.sh: code checks, unit tests and a full
# build on Fedora 44 and Debian 13, on every push and pull request (including
# Dependabot's). The VM and screen tests run locally with ./test-pipeline.sh.
name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Build tools and libraries
        run: >
          dnf -y install git rust cargo clippy rustfmt gcc pkgconf-pkg-config
          gtk4-devel libadwaita-devel libvirt-devel libosinfo-devel osinfo-db
          spice-glib-devel gvnc-devel vte291-gtk4-devel desktop-file-utils appstream
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fedora44-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint (Debian 13 variant)
        run: cargo clippy -p virt-manager-nextgen --all-targets --no-default-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: Build
        run: cargo build --workspace --all-targets
      - name: App metadata
        run: |
          desktop-file-validate data/*.desktop
          appstreamcli validate --no-net data/*.metainfo.xml

  debian:
    name: Debian 13
    runs-on: ubuntu-latest
    container: docker.io/library/debian:trixie
    steps:
      - name: Build tools and libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates rustup pkg-config build-essential \
            libgtk-4-dev libadwaita-1-dev libvirt-dev libosinfo-1.0-dev osinfo-db \
            libspice-client-glib-2.0-dev libgvnc-1.0-dev libvte-2.91-gtk4-dev \
            librsvg2-common
          # Debian 13's own Rust is older than the app needs.
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: debian13-${{ hashFiles('Cargo.lock') }}
      # GTK 4.18 / libadwaita 1.7: the build without the gnome49 feature.
      - name: Lint
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --no-default-features
      - name: Build
        run: cargo build --workspace --all-targets --no-default-features
