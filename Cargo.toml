[workspace]
resolver = "3"
members = ["crates/xml", "crates/virt", "crates/osinfo", "crates/display", "crates/app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/inittux111/virt-manager-nextgen"

[workspace.dependencies]
vmng-xml = { path = "crates/xml" }
vmng-virt = { path = "crates/virt" }
vmng-osinfo = { path = "crates/osinfo" }
vmng-display = { path = "crates/display" }
# GTK4 + libadwaita: the required UI toolkit. The baseline is what Debian 13
# has (GTK 4.18, libadwaita 1.7); the app's `gnome49` feature (on by default)
# adds what GNOME 49 brings (GTK 4.20, libadwaita 1.8).
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
# Thin, official bindings to the libvirt C library (the only way to talk to libvirt).
virt = { version = "0.4.3", features = ["qemu"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
