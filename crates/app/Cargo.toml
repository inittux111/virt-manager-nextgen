[package]
name = "virt-manager-nextgen"
description = "A modern desktop manager for QEMU/KVM virtual machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "virt-manager-nextgen"
path = "src/main.rs"

[dependencies]
vmng-xml.workspace = true
vmng-virt.workspace = true
vmng-osinfo.workspace = true
vmng-display.workspace = true
gtk.workspace = true
adw.workspace = true

[features]
default = ["gnome49"]
# GTK 4.20 and libadwaita 1.8 (Fedora 44, Debian testing): the native
# Keyboard Shortcuts dialog. Without it the app builds against GTK 4.18 and
# libadwaita 1.7 (Debian 13) and uses its own shortcuts window.
gnome49 = ["gtk/v4_20", "adw/v1_8"]

[lints]
workspace = true
